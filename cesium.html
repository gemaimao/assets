<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <title>Cesium 3D Player</title>
    <!-- 引入 CesiumJS 库 -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <!-- 引入罗盘控制盘插件 -->
    <script src="https://unpkg.com/cesium-navigation-es6@3.0.3/dist/CesiumNavigation.umd.js"></script>
    
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            background-color: #000;
        }
        .cesium-widget-credits { display: none !important; }
        
        #custom-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            pointer-events: none;
            z-index: 10;
        }
        #custom-panel h1 { margin: 0 0 10px 0; font-size: 20px; font-weight: 300; letter-spacing: 2px; }
        #custom-panel p { margin: 0; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="custom-panel">
        <h1 id="project-title">加载中...</h1>
        <p>基于数据驱动的 3D 沉浸式引擎</p>
    </div>

    <script>
        // 尝试从刚才配好的文件中读取 Token
        // 注意：为了自动化，以后你应该把 Token 配置在 JSON 里
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJhZDY0YWY3Yy1mZmQ1LTQ2MjgtYTRjZi01OTM0NzQ3YjljOGMiLCJpZCI6NDM2NzA2LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzk4MDU4MjZ9.80efk41binldWGgit3mGqqZ3keritykzZUoNw0qoQc0';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrain: Cesium.Terrain.fromWorldTerrain(), 
            animation: false,       
            timeline: false,        
            baseLayerPicker: false, 
            fullscreenButton: false,
            geocoder: false,        
            homeButton: false,      
            infoBox: true,          
            sceneModePicker: false, 
            selectionIndicator: false, 
            navigationHelpButton: false 
        });

        viewer.scene.postProcessStages.fxaa.enabled = true;

        // 初始化 3D 罗盘和导航仪
        try {
            const options = {
                defaultResetView: Cesium.Cartographic.fromDegrees(90, 30, 2000000), // 默认回到的位置
                enableCompass: true,
                enableZoomControls: true,
                enableDistanceLegend: true,
                enableCompassOuterRing: true
            };
            new CesiumNavigation(viewer, options);
        } catch(e) {
            console.warn("罗盘插件加载失败:", e);
        }

        // ==========================================
        // 核心：基于 cesium_config.json 的数据驱动渲染
        // ==========================================
        fetch('./cesium_config.json')
            .then(res => res.json())
            .then(config => {
                // 1. 更新标题
                if (config.project_name) {
                    document.getElementById('project-title').innerText = config.project_name;
                }

                // 2. 加载 POI 点位
                if (config.pois && config.pois.length > 0) {
                    config.pois.forEach(poi => {
                        const position = Cesium.Cartesian3.fromDegrees(poi.lon, poi.lat, poi.alt || 0);
                        viewer.entities.add({
                            name: poi.name,
                            position: position,
                            point: {
                                pixelSize: 12,
                                color: Cesium.Color.fromCssColorString('#0ea5e9'),
                                outlineColor: Cesium.Color.WHITE,
                                outlineWidth: 2,
                                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
                            },
                            label: {
                                text: poi.name,
                                font: '12pt sans-serif',
                                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                                outlineWidth: 2,
                                verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                                pixelOffset: new Cesium.Cartesian2(0, -15),
                                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
                            },
                            description: poi.html_content || ''
                        });
                    });
                }

                // 3. 加载路线 (如果存在)
                if (config.routes && config.routes.length > 0) {
                    config.routes.forEach(route => {
                        // 将 [[lon, lat], ...] 转换为平铺数组 [lon, lat, lon, lat]
                        let flatCoords = [];
                        route.coordinates.forEach(c => {
                            flatCoords.push(c[0]);
                            flatCoords.push(c[1]);
                        });
                        viewer.entities.add({
                            name: route.name || "路线",
                            polyline: {
                                positions: Cesium.Cartesian3.fromDegreesArray(flatCoords),
                                width: 5,
                                material: Cesium.Color.fromCssColorString('#e11d48').withAlpha(0.8),
                                clampToGround: true // 紧贴地形
                            }
                        });
                    });
                }

                // 4. 执行开场飞行
                if (config.cameraStart) {
                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(
                            config.cameraStart.lon, 
                            config.cameraStart.lat, 
                            config.cameraStart.alt || 10000
                        ),
                        orientation: {
                            heading: Cesium.Math.toRadians(config.cameraStart.heading || 0),
                            pitch: Cesium.Math.toRadians(config.cameraStart.pitch || -45),
                            roll: 0.0
                        },
                        duration: 5,
                        easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT
                    });
                }
            })
            .catch(e => {
                console.error("加载配置文件失败或不存在:", e);
                document.getElementById('project-title').innerText = "暂无配置数据";
            });

    </script>
</body>
</html>
